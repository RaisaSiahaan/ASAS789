<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lembar Jawaban - Pilihan Ganda</title>
<style>
  :root { --ink:#333; --line:#555; --muted:#777; --paper:#fff; --bg:#ededed; }
  * { box-sizing:border-box; }
  body { margin:0; padding:18px 12px 30px; background:var(--bg); color:var(--ink);
         font-family:Arial, Helvetica, sans-serif; }
  .sheet { width:min(100%, 760px); min-height: min(900px, calc(100vh - 36px));
           margin:0 auto; background:var(--paper); border:2px solid #555;
           border-radius:18px; overflow:hidden; }
  .topbar { height:76px; background:#444; color:#fff; padding:13px 18px;
            display:flex; justify-content:space-between; align-items:center; }
  .eyebrow { font-size:10px; font-weight:700; letter-spacing:.5px; margin-bottom:5px; }
  h1 { font-size:21px; line-height:1.1; margin:0; }
  .list-icon { width:48px; height:48px; background:white; color:#444; border-radius:50%;
               display:grid; place-items:center; font-size:27px; font-weight:bold; }
  .content { padding:16px 18px 24px; }
  .identity { display:flex; gap:9px; flex-wrap:wrap; align-items:center; margin-bottom:7px; }
  .identity label { font-size:14px; white-space:nowrap; }
  .identity input { border:0; border-bottom:1px solid #777; border-radius:0; outline:none;
                    padding:5px 3px; font-size:14px; min-width:0; }
  #nama { width:190px; }
  #kelas { width:75px; }
  .instruction { color:#777; font-size:12px; margin:7px 0 20px; }
  .answers { display:grid; grid-template-columns:1fr 1fr; column-gap:24px; }
  .column { display:flex; flex-direction:column; gap:25px; }
  .question { min-height:28px; display:flex; align-items:center; gap:13px; }
  .number { width:22px; font-size:14px; font-weight:700; flex:0 0 22px; }
  .choices { display:flex; align-items:center; gap:7px; }
  .choice { position:relative; display:inline-flex; width:30px; height:30px; cursor:pointer; }
  .choice input { position:absolute; opacity:0; inset:0; margin:0; cursor:pointer; }
  .bubble { width:30px; height:30px; border:1px solid #777; border-radius:50%;
            display:grid; place-items:center; font-size:12px; background:white; }
  .choice input:checked + .bubble { background:#444; color:#fff; border:2px solid #222; font-weight:bold; }
  .choice input:focus-visible + .bubble { outline:3px solid #8ab4f8; outline-offset:2px; }
  .actions { margin-top:35px; display:flex; justify-content:center; }
  button { border:0; border-radius:8px; padding:13px 28px; background:#444; color:white;
           font-size:15px; font-weight:700; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  .status { min-height:20px; margin-top:12px; text-align:center; font-size:13px; color:#555; }
  .warning-note { margin-top:14px; text-align:center; color:#888; font-size:11px; }
  @media (max-width:520px) {
    body { padding:8px 5px 18px; }
    .sheet { min-height:calc(100vh - 16px); border-radius:14px; }
    .content { padding:15px 12px 22px; }
    .answers { column-gap:9px; }
    .column { gap:23px; }
    .question { gap:7px; }
    .number { width:18px; flex-basis:18px; }
    .choices { gap:4px; }
    .choice,.bubble { width:27px; height:27px; }
    .bubble { font-size:11px; }
    #nama { width:155px; }
  }
</style>
</head>
<body>
<main class="sheet">
  <header class="topbar">
    <div><div class="eyebrow">LEMBAR JAWAB</div><h1>Pilihan Ganda</h1></div>
    <div class="list-icon" aria-hidden="true">☷</div>
  </header>
  <section class="content">
    <form id="answerForm">
      <div class="identity">
        <label for="nama">Nama:</label><input id="nama" name="nama" autocomplete="name" required>
        <label for="kelas">Kelas:</label><input id="kelas" name="kelas" required>
      </div>
      <p class="instruction">Hitamkan satu bulatan tiap nomor.</p>
      <div class="answers" aria-label="Lembar jawaban pilihan ganda">
        <div class="column" id="leftColumn"></div>
        <div class="column" id="rightColumn"></div>
      </div>
      <div class="actions"><button id="submitBtn" type="submit">KUMPULKAN JAWABAN</button></div>
      <div class="status" id="status" role="status" aria-live="polite"></div>
      <div class="warning-note">Aktivitas perpindahan tab dicatat selama pengerjaan.</div>
    </form>
  </section>
</main>
<script>
  // GANTI dengan URL Web App Google Apps Script setelah deploy.
  const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby5XvFUQPNU5d0O-tGYUMiRQ2nXUnXpruHjTlVKCpYMJKlVrCHKDp2Ulk_PjRVX5Qdq/exec";
  const MAX_WARNINGS = 3;

  const left = document.getElementById("leftColumn");
  const right = document.getElementById("rightColumn");

  function makeQuestion(number) {
    const row = document.createElement("div");
    row.className = "question";
    row.innerHTML = `<span class="number">${number}.</span><div class="choices"></div>`;
    const choices = row.querySelector(".choices");
    ["A","B","C","D"].forEach(letter => {
      const label = document.createElement("label");
      label.className = "choice";
      label.innerHTML = `<input type="radio" name="q${number}" value="${letter}" aria-label="Nomor ${number}, pilihan ${letter}"><span class="bubble">${letter}</span>`;
      choices.appendChild(label);
    });
    return row;
  }
  for (let n=1; n<=5; n++) left.appendChild(makeQuestion(n));
  for (let n=6; n<=10; n++) right.appendChild(makeQuestion(n));

  let warningCount = 0;
  let violationLog = [];
  let submitted = false;
  let quizActive = true;

  const form = document.getElementById("answerForm");
  const submitBtn = document.getElementById("submitBtn");
  const statusBox = document.getElementById("status");

  function recordTabViolation() {
    if (!quizActive || submitted || document.visibilityState !== "hidden") return;
    warningCount++;
    const time = new Date().toISOString();
    violationLog.push({ke: warningCount, waktu: time, kejadian: "Berpindah dari tab kuis"});
    if (warningCount < MAX_WARNINGS) {
      alert(`PERINGATAN ${warningCount}/${MAX_WARNINGS}\n\nKamu terdeteksi meninggalkan tab lembar jawaban. Tetap berada di halaman kuis sampai selesai.`);
    } else {
      quizActive = false;
      alert("PERINGATAN 3/3\n\nBatas perpindahan tab telah tercapai. Jawaban akan dikumpulkan otomatis.");
      setTimeout(() => submitAnswers(true), 2000);
    }
  }
  document.addEventListener("visibilitychange", recordTabViolation);

  function collectData(autoSubmitted) {
    const answers = {};
    for (let n=1; n<=10; n++) {
      const selected = form.querySelector(`input[name="q${n}"]:checked`);
      answers[`q${n}`] = selected ? selected.value : "";
    }
    return {
      nama: document.getElementById("nama").value.trim(),
      kelas: document.getElementById("kelas").value.trim(),
      answers,
      jumlahPelanggaran: warningCount,
      catatanPelanggaran: violationLog,
      waktu: new Date().toISOString(),
      statusPengumpulan: autoSubmitted ? "Otomatis - peringatan ke-3" : "Dikirim siswa"
    };
  }

  async function submitAnswers(autoSubmitted=false) {
    if (submitted) return;
    const nama = document.getElementById("nama").value.trim();
    const kelas = document.getElementById("kelas").value.trim();
    if (!nama || !kelas) {
      statusBox.textContent = "Isi Nama dan Kelas terlebih dahulu agar jawaban dapat dikumpulkan.";
      document.getElementById(!nama ? "nama" : "kelas").focus();
      return;
    }
    submitted = true;
    quizActive = false;
    submitBtn.disabled = true;
    submitBtn.textContent = "MENGIRIM...";
    statusBox.textContent = "Sedang mengirim jawaban...";
    const data = collectData(autoSubmitted);

    if (!GOOGLE_SCRIPT_URL.startsWith("https://script.google.com/")) {
      statusBox.textContent = "URL Google Apps Script belum dipasang. Hubungi guru/pengelola kuis.";
      submitBtn.textContent = "BELUM TERKIRIM";
      submitted = false;
      return;
    }

    try {
      // no-cors dipakai agar halaman statis (mis. GitHub Pages) dapat mengirim ke Apps Script.
      // Browser tidak mengizinkan halaman membaca balasan; status di bawah berarti permintaan terkirim.
      await fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: {"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},
        body: new URLSearchParams({payload: JSON.stringify(data)})
      });
      form.querySelectorAll("input").forEach(el => el.disabled = true);
      submitBtn.textContent = "JAWABAN TERKIRIM";
      statusBox.textContent = "Permintaan pengiriman selesai. Silakan tunggu instruksi guru.";
    } catch (err) {
      submitted = false;
      quizActive = !autoSubmitted;
      submitBtn.disabled = false;
      submitBtn.textContent = "COBA KIRIM LAGI";
      statusBox.textContent = "Koneksi bermasalah. Periksa internet lalu coba kirim kembali.";
    }
  }

  form.addEventListener("submit", event => {
    event.preventDefault();
    submitAnswers(false);
  });
</script>
</body>
</html>
